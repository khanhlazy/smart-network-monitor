apiVersion: v1
kind: Secret
metadata:
  name: smartnms-secrets
  namespace: smartnms
type: Opaque
stringData:
  MONGODB_URI: "mongodb://smartnms-mongo:27017/smartnms"
  JWT_SECRET: "replace-with-production-secret"
  JWT_REFRESH_SECRET: "replace-with-production-refresh-secret"
  ENCRYPTION_KEY: "replace-with-production-encryption-key"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
