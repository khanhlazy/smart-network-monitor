apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartnms-backend
  namespace: smartnms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smartnms-backend
  template:
    metadata:
      labels:
        app: smartnms-backend
    spec:
      containers:
        - name: backend
          image: smartnms-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: smartnms-config
            - secretRef:
                name: smartnms-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: smartnms-backend
  namespace: smartnms
spec:
  selector:
    app: smartnms-backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
