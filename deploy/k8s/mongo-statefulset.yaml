apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: smartnms-mongo
  namespace: smartnms
spec:
  serviceName: smartnms-mongo
  replicas: 1
  selector:
    matchLabels:
      app: smartnms-mongo
  template:
    metadata:
      labels:
        app: smartnms-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: smartnms-mongo
  namespace: smartnms
spec:
  selector:
    app: smartnms-mongo
  ports:
    - port: 27017
      targetPort: 27017
